<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ash × Izzy · 分你一只耳机</title>
  <style>
    :root{color-scheme:light dark;--paper:#fff8fb;--paper-end:#fff0f6;--ink:#4d293a;--muted:#6f4d5e;--line:#edd5e0;--accent:#a83f66;--soft:#fbe4ee;--button:#f3aec7;--button-ink:#57253d;--button-hover:#ed9dbb;--progress:#c95783}
    *{box-sizing:border-box}body{margin:0;background:transparent;color:var(--ink);font:14px/1.5 system-ui,-apple-system,"PingFang SC",sans-serif}
    .card{max-width:480px;margin:auto;padding:18px 18px 14px;background:linear-gradient(145deg,var(--paper),var(--paper-end));border:1px solid var(--line);border-radius:20px}
    header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:17px}.brand{font-size:11px;letter-spacing:.08em;font-weight:650;color:var(--accent)}.brand span{display:block;letter-spacing:.03em;font-size:10px;font-weight:400;color:var(--muted)}
    button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;min-width:44px;min-height:44px;border:0;background:transparent;border-radius:50%}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:hover:enabled{background:var(--soft)}
    .refresh{font-size:12px;border-radius:12px;padding:0 10px;color:var(--accent)}.track{display:grid;grid-template-columns:78px minmax(0,1fr);gap:15px;align-items:center}.cover{width:78px;height:78px;border-radius:13px;background:var(--soft);position:relative;overflow:hidden;display:grid;place-items:center}.cover svg{width:38px;height:38px;opacity:.5}.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    h1{font-size:18px;line-height:1.35;letter-spacing:-.03em;margin:0 0 5px;overflow-wrap:anywhere}.artist{color:var(--muted);font-size:12px;margin:0;overflow-wrap:anywhere}.status{font-size:10px;display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--accent)}.dot{height:5px;width:5px;border-radius:50%;background:currentColor}
    .lyrics{height:92px;display:flex;flex-direction:column;justify-content:center;gap:3px;margin:16px 0 10px;text-align:center}.lyric{margin:0;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lyric.current{font-size:14px;font-weight:550;color:var(--ink)}.translation{font-size:10px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    progress{display:block;width:100%;height:4px;appearance:none;border:0;border-radius:4px;background:var(--line);accent-color:var(--progress)}progress::-webkit-progress-bar{background:var(--line);border-radius:4px}progress::-webkit-progress-value{background:var(--progress);border-radius:4px}progress::-moz-progress-bar{background:var(--progress);border-radius:4px}.times{display:flex;justify-content:space-between;margin-top:6px;color:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}
    .controls{display:flex;align-items:center;justify-content:center;gap:22px;margin:7px 0 12px;color:var(--accent)}.controls svg{width:20px;height:20px;vertical-align:middle;fill:currentColor}.controls .toggle{width:52px;height:52px;color:var(--button-ink);background:var(--button)}.controls .toggle:hover:enabled{background:var(--button-hover)}
    .footer{border-top:1px solid var(--line);padding-top:10px;font-size:10px;color:var(--muted)}.footer-row{display:flex;justify-content:space-between;gap:10px;align-items:center}.auto{display:flex;gap:5px;align-items:center;min-height:30px}.auto input{accent-color:var(--accent);margin:0}.notice{margin:3px 0 0;min-height:30px;overflow-wrap:anywhere}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
    [hidden]{display:none!important}@media(prefers-color-scheme:dark){:root{--paper:#30212b;--paper-end:#3a2633;--ink:#ffedf5;--muted:#d9b3c4;--line:#694453;--accent:#f0aac5;--soft:#4a2e3d;--button:#f0aac5;--button-ink:#482137;--button-hover:#f6bfd5;--progress:#f0aac5}}html[data-theme="light"]{color-scheme:light;--paper:#fff8fb;--paper-end:#fff0f6;--ink:#4d293a;--muted:#6f4d5e;--line:#edd5e0;--accent:#a83f66;--soft:#fbe4ee;--button:#f3aec7;--button-ink:#57253d;--button-hover:#ed9dbb;--progress:#c95783}html[data-theme="dark"]{color-scheme:dark;--paper:#30212b;--paper-end:#3a2633;--ink:#ffedf5;--muted:#d9b3c4;--line:#694453;--accent:#f0aac5;--soft:#4a2e3d;--button:#f0aac5;--button-ink:#482137;--button-hover:#f6bfd5;--progress:#f0aac5}
    @media(max-width:340px){.card{padding:14px}.track{grid-template-columns:64px minmax(0,1fr);gap:12px}.cover{width:64px;height:64px}h1{font-size:16px}.brand{font-size:10px}.controls{gap:16px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
    .playback-choice{display:flex;align-items:center;gap:8px;margin:0 0 16px;font-size:12px;color:var(--muted)}.playback-choice select{min-height:36px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);padding:4px 10px;font:inherit}.playback-choice span{flex:1;text-align:right;font-size:11px}audio{display:none}
    #seek{--fill:0%;display:block;appearance:none;-webkit-appearance:none;width:100%;height:28px;margin:0;background:transparent;cursor:pointer;touch-action:pan-y}
    #seek::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--progress) var(--fill),var(--line) var(--fill))}
    #seek::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border:3px solid var(--paper);border-radius:50%;background:var(--progress);box-shadow:0 0 0 1px var(--progress)}
    #seek::-moz-range-track{height:4px;border-radius:4px;background:var(--line)}#seek::-moz-range-progress{height:4px;border-radius:4px;background:var(--progress)}#seek::-moz-range-thumb{width:10px;height:10px;border:3px solid var(--paper);border-radius:50%;background:var(--progress);box-shadow:0 0 0 1px var(--progress)}#seek:disabled{cursor:default;opacity:.6}
    .library-nav{display:flex;gap:6px;margin:-6px 0 12px}.library-nav button,.library-head button,.library-pages button,.library-search button{border-radius:10px;padding:4px 10px;min-height:36px;color:var(--accent);font-size:12px}.library-nav button[aria-pressed="true"]{background:var(--soft);font-weight:600}.library-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}.library-head h2{margin:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.library-search{display:flex;gap:6px;margin-bottom:10px}.library-search input{width:100%;min-width:0;min-height:38px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--paper);color:var(--ink);font:inherit}.library-list{height:256px;overflow-y:auto;overscroll-behavior:contain}.library-row{display:flex;align-items:center;gap:10px;text-align:left;width:100%;min-height:58px;padding:7px;border-radius:12px}.library-row img{height:42px;width:42px;border-radius:8px;object-fit:cover;flex-shrink:0}.library-row span{min-width:0;display:block}.library-row strong,.library-row small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.library-row strong{font-size:13px;font-weight:550}.library-row small{font-size:11px;color:var(--muted)}.library-pages{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:10px;color:var(--muted)}.library-message,.library-feedback{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.library-message{margin:6px 0;min-height:18px}.library-feedback:empty{display:none}.library-feedback{margin:0 0 8px}
  </style>
</head>
<body>
  <main class="card" aria-label="Ash × Izzy 音乐播放器">
    <header><div class="brand">Ash × Izzy<span id="source-label">分你一只耳机</span></div><button id="refresh" class="refresh" type="button" aria-label="刷新播放状态" disabled>刷新 ↻</button></header>
    <nav class="library-nav" aria-label="音乐浏览"><button id="show-player" type="button" aria-pressed="true" disabled>播放器</button><button id="show-playlists" type="button" aria-pressed="false" disabled>我的歌单</button><button id="show-search" type="button" aria-pressed="false" disabled>搜索歌曲</button></nav>
    <p id="library-feedback" class="library-feedback" role="status" aria-live="polite"></p>
    <div id="player-panel">
    <div class="playback-choice"><label for="playback-mode">播放端</label><select id="playback-mode" disabled><option value="pwa">手机 PWA</option><option value="chatgpt">ChatGPT</option></select><span id="mode-status">稳定模式 · 手机 PWA</span></div>
    <section class="track" aria-label="歌曲信息">
      <div class="cover"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="20" cy="20" r="16"/><circle cx="20" cy="20" r="5"/><path d="M9 20a11 11 0 0 1 11-11"/></svg><img id="cover" alt="专辑封面" referrerpolicy="no-referrer" hidden></div>
      <div><h1 id="title">分你一只耳机</h1><p id="artist" class="artist">正在连接播放器…</p><div class="status"><span class="dot" aria-hidden="true"></span><span id="status">等待实况</span></div></div>
    </section>
    <section class="lyrics" aria-label="附近歌词"><p id="previous-line" class="lyric"></p><p id="current-line" class="lyric current">让音乐陪我们待一会儿</p><p id="translation" class="lyric translation"></p><p id="next-line" class="lyric"></p></section>
    <progress id="progress" max="100" value="0" aria-label="播放进度"></progress><input id="seek" type="range" min="0" max="1000" value="0" aria-label="调整 ChatGPT 播放进度" hidden><div class="times"><span id="position">—:—</span><span id="duration">—:—</span></div>
    <nav class="controls" aria-label="手机播放控件">
      <button id="previous" type="button" aria-label="上一首（队列顺序）" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h2v14H5zm14 0v14L8 12z"/></svg></button>
      <button id="toggle" class="toggle" type="button" aria-label="播放" disabled><span id="play-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 4 12 8-12 8z"/></svg></span><span id="pause-icon" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg></span></button>
      <button id="next" type="button" aria-label="下一首" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5h2v14h-2zM5 5l11 7-11 7z"/></svg></button>
    </nav>
    </div>
    <section id="library-panel" aria-label="我的音乐" hidden>
      <div class="library-head"><button id="library-back" type="button" aria-label="返回">‹ 返回</button><h2 id="library-title">我的歌单</h2></div>
      <form id="library-search" class="library-search" hidden><label class="sr-only" for="library-query">歌曲或歌手</label><input id="library-query" type="search" maxlength="80" placeholder="歌曲或歌手" autocomplete="off"><button id="library-search-submit" type="submit">搜索</button></form>
      <p id="library-message" class="library-message" role="status" aria-live="polite"></p>
      <div id="library-list" class="library-list" aria-label="音乐列表" aria-busy="false"></div>
      <div class="library-pages"><button id="library-prev" type="button">上一页</button><span id="library-page"></span><button id="library-next" type="button">下一页</button><button id="library-retry" type="button" hidden>重试</button></div>
    </section>
    <footer class="footer"><div class="footer-row"><span id="updated">尚未刷新</span><label class="auto"><input id="auto" type="checkbox" checked>自动刷新</label></div><p id="notice" class="notice" role="status" aria-live="polite">正在连接播放器…</p></footer>
  </main>
  <audio id="local-audio" preload="metadata" playsinline></audio>
  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const MEDIA_ORIGIN = null;
    const elements = ['refresh','cover','title','artist','status','previous-line','current-line','translation','next-line','progress','position','duration','previous','toggle','next','play-icon','pause-icon','updated','auto','notice','local-audio','playback-mode','mode-status','source-label','seek','show-player','show-playlists','show-search','player-panel','library-panel','library-feedback','library-back','library-title','library-search','library-query','library-search-submit','library-message','library-list','library-prev','library-next','library-page','library-retry'];
    const el = Object.fromEntries(elements.map(id => [id, $(id)]));
    let view = null, receivedAt = 0, busy = false, reading = false, connected = false, stopped = false, onscreen = true;
    let mode = 'standard', rpcId = 0, hostOrigin = '*', lastPoll = 0, activeUntil = Date.now() + 300000;
    let failedControl = null;
    const retiredStreams = new Set();
    const pending = new Map();
    const timers = [];
    const newIdentity=prefix=>prefix+(window.crypto?.randomUUID?.() || Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
    let sourceId=newIdentity('widget-');
    const instanceId=newIdentity('mount-');
    const localAudio=el['local-audio'];
    let localLease=null,localTrack=null,localSequence=0,localGeneration=0,localChanging=false,localReady=false,localPlayed=false;
    let reportPending=null,reportFlight=null,widgetPolling=false,lastAudioReport=0,lastAudioAck=0;
    let mayAcquire=false,claimRequest=null,ownerGeneration=0,playbackIntent=false,resumeOnVisible=false,seekDragging=false,lastCheckpoint=0;
    let checkpoint=null;
    let notice=null;
    let libraryPage='player',libraryRequest=0,libraryData=null,libraryArgs=null,libraryLoading=false,libraryPlaylist=null,playlistOffset=0,pickRetry=null,pickedSongId=null;
    function hydrateIdentity() {
      try {
        const saved=window.openai?.widgetState?.privateContent,client=saved?.playbackClient;
        if(client?.version===1&&/^[A-Za-z0-9_-]{8,80}$/.test(client.sourceId))sourceId=client.sourceId;
        const p=saved?.playback;if(!localTrack&&p?.version===1&&/^\d{1,20}$/.test(p.song?.songId)&&Number.isFinite(p.positionMs)&&p.positionMs>=0&&typeof p.playbackIntent==='boolean')checkpoint=p;
      }catch(_){}
    }
    hydrateIdentity();
    function persistIdentity() {
      try {window.openai?.setWidgetState?.({privateContent:{playbackClient:{version:1,sourceId},...(checkpoint?{playback:checkpoint}:{})}});}catch(_){}
    }
    function remember(force=false) {
      if(!localTrack || (!force && Date.now()-lastCheckpoint<5000))return;
      lastCheckpoint=Date.now();
      checkpoint={version:1,song:{songId:localTrack.song.songId,title:String(localTrack.song.title||'').slice(0,160),artist:String(localTrack.song.artist||'').slice(0,160),coverUrl:safeCover(localTrack.song.coverUrl),durationMs:localTrack.song.durationMs},positionMs:Math.max(0,Math.round((localAudio.currentTime||0)*1000)),playbackIntent,actualPlaying:!localAudio.paused&&!localAudio.ended,savedAt:Date.now()};
      // Official widget-scoped UI persistence only; never store lease/media URLs.
      persistIdentity();
    }
    const handledCommands=new Set();
    const requestId=()=>window.crypto?.randomUUID?.() || 'ui-'+Date.now()+'-'+Math.random().toString(36).slice(2);
    function localOwner() { return !!(localLease && view?.playback?.mode==='chatgpt' && view.playback.sourceId===sourceId && view.playback.ownerSourceId===sourceId && !view.playback.handoff); }
    function playbackInfo(value) {
      if(!value || !view || value.streamId!==view.streamId || retiredStreams.has(value.streamId) || (view.playback?.streamId===value.streamId && value.epoch<view.playback.epoch))return;
      view.playback=value;
    }
    async function audioTool(args) {
      const result=await callTool('music_widget_playback',{...args,sourceId,instanceId});
      playbackInfo(result.structuredContent?.playback);return result;
    }
    function libraryNavigation(page) {
      libraryPage=page;++libraryRequest;libraryLoading=false;
      el['player-panel'].hidden=page!=='player';el['library-panel'].hidden=page==='player';
      for(const [id,selected] of [['show-player',page==='player'],['show-playlists',page==='playlists'||page==='tracks'],['show-search',page==='search']])el[id].setAttribute('aria-pressed',String(selected));
      el['library-search'].hidden=page!=='search';
      el['library-title'].textContent=page==='tracks'?libraryPlaylist?.name||'歌单歌曲':page==='search'?'搜索歌曲':'我的歌单';
    }
    function libraryRows(data) {
      el['library-list'].replaceChildren();el['library-list'].scrollTop=0;
      for(const item of data.items){
        const row=document.createElement('button');row.type='button';row.className='library-row';row.disabled=busy;
        const cover=safeCover(item.coverUrl);if(cover){const img=document.createElement('img');img.src=cover;img.alt='';img.loading='lazy';img.referrerPolicy='no-referrer';img.addEventListener('error',()=>{img.hidden=true;});row.append(img);}
        const labels=document.createElement('span'),title=document.createElement('strong'),detail=document.createElement('small');
        title.textContent=data.op==='playlists'&&item.liked?'我喜欢的音乐':item.name||item.title||'未命名';
        detail.textContent=data.op==='playlists'?item.count+' 首 · '+(item.liked?'喜欢':item.mine?'我创建的':'我收藏的'):item.artist||'未知歌手';
        labels.append(title,detail);row.append(labels);row.addEventListener('click',()=>{
          if(busy||libraryLoading)return;
          if(data.op==='playlists'){playlistOffset=data.offset;libraryPlaylist=item;libraryNavigation('tracks');loadLibrary({op:'tracks',playlistId:item.playlistId,offset:0});}
          else pickSong(item);
        });el['library-list'].append(row);
      }
      el['library-message'].textContent=data.items.length?'点'+(data.op==='playlists'?'歌单查看歌曲':'一首歌在当前播放端播放')+(data.total>=data.limit?' · 本次最多读取 '+data.limit+' 项':''):(data.op==='search'?'没有找到歌曲，换个关键词试试。':'这个列表暂时没有内容。');
      el['library-page'].textContent=data.total?(data.offset+1)+'–'+(data.offset+data.items.length)+' / '+data.total:'0 项';
      el['library-prev'].disabled=data.offset===0;el['library-next'].disabled=data.nextOffset===null;
    }
    async function loadLibrary(args) {
      if(!connected||stopped)return;
      const request=++libraryRequest;libraryArgs=args;libraryLoading=true;libraryData=null;
      el['library-message'].textContent='正在读取…';el['library-list'].replaceChildren();el['library-list'].setAttribute('aria-busy','true');
      el['library-prev'].disabled=el['library-next'].disabled=true;el['library-page'].textContent='';el['library-retry'].hidden=true;
      try {const result=await callTool('music_player_library',args);if(request!==libraryRequest||stopped)return;libraryData=result.structuredContent;libraryRows(libraryData);}
      catch(error){if(request!==libraryRequest||stopped)return;el['library-message'].textContent=error.message==='bridge_timeout'?'读取超时，请重试。':error.message==='bridge_error'?'读取暂未完成，请重试。':error.message;el['library-retry'].hidden=false;}
      finally{if(request===libraryRequest){libraryLoading=false;el['library-list'].setAttribute('aria-busy','false');}}
    }
    async function pickSong(song) {
      if(busy||!view?.playback||stopped)return;
      if(view.playback.handoff){el['library-message'].textContent='播放端正在交接，请等完成后再点歌。';return;}
      busy=true;render();el['library-message'].textContent='正在准备《'+song.title+'》…';el['library-feedback'].textContent='';
      try {
        if(view.playback.mode==='chatgpt'&&!localOwner())await pollAudio();
        await reportFlight;
        const owner=view.playback;
        if(owner.mode==='chatgpt'&&owner.sourceId!==sourceId)throw new Error('请先返回播放器，将 ChatGPT 播放端接到此卡片，再选择歌曲。');
        const args=pickRetry?.songId===song.songId&&pickRetry.expectedEpoch===owner.epoch&&pickRetry.expectedStreamId===owner.streamId?pickRetry:{op:'pick',songId:song.songId,requestId:requestId(),expectedEpoch:owner.epoch,expectedStreamId:owner.streamId,...(localOwner()?localLease:{})};
        pickRetry=args;
        if(localOwner())stopAudio();
        const result=await audioTool(args);
        if(!result.structuredContent?.selected)throw new Error('播放端已变化，请刷新播放器后重试。');
        pickRetry=null;pickedSongId=song.songId;if(owner.mode==='chatgpt'){localPlayed=true;playbackIntent=true;}activeUntil=Date.now()+300000;
        applyAudio(result._meta?.audio,result._meta?.lease);
        libraryNavigation('player');
        el['library-feedback'].textContent=result.structuredContent.audioError||(result.structuredContent.pending?'已发送选歌，等待当前播放端加载。':'歌曲已准备；如未出声，请点播放。');
      }catch(error){el['library-message'].textContent=error.message==='bridge_timeout'||error.message==='bridge_error'?'选歌尚未确认，请再点同一首歌重试。':error.message;reportAudio();}
      finally{busy=false;render();await refresh();}
    }
    function stopAudio() { localChanging=true;++localGeneration;reportPending=null;localAudio.pause();localChanging=false; }
    function reportAudio() {
      if(!localOwner() || !localReady || localChanging || stopped)return;
      reportPending={op:'report',...localLease,sourceId,sequence:++localSequence,trackId:localTrack.trackId,songId:localTrack.song.songId,positionMs:Math.round((localAudio.currentTime||0)*1000),playing:!localAudio.paused&&!localAudio.ended,playbackIntent};
      lastAudioReport=Date.now();flushAudioReport();
    }
    function flushAudioReport() {
      if(reportFlight)return reportFlight;
      reportFlight=(async()=>{
        while(reportPending && !stopped){const body=reportPending;reportPending=null;const result=await audioTool(body);
          if(body.sessionId!==localLease?.sessionId)continue;
          if(result.structuredContent?.staleTrack||body.trackId!==localTrack?.trackId)continue;
          if(!result.structuredContent?.accepted){++ownerGeneration;stopAudio();localLease=null;mayAcquire=false;showNotice('播放权已交给另一端，请刷新后选择播放端。');break;}
          lastAudioAck=Date.now();
          if(view?.playback?.handoff){stopAudio();Promise.resolve().then(()=>pollAudio());}
        }
      })().catch(()=>{showNotice('播放状态暂未同步；请检查连接，或切回手机 PWA。');}).finally(()=>{reportFlight=null;if(reportPending&&!stopped)flushAudioReport();});return reportFlight;
    }
    async function acknowledge(owner) {
      if(!localLease || owner.ownerSourceId!==sourceId)return;
      ++ownerGeneration;
